[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "domain-app"
version = "0.1.0"
description = "OOP domain model lab with tests"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "mypy>=1.10",
]

[project.scripts]
domain-app = "domain_app.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers"]
markers = [
    "integration: integration tests",
]
asyncio_mode = "auto"

[tool.coverage.run]
branch = true
source = ["src/domain_app"]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 80